# Publica la landing en https://club.rebecacaceres.com con GitHub Pages.
# Se ejecuta en cada push a main que toque la web, o a mano desde la pestaña Actions.
# Los borradores version-*.html no se publican.
#
# DNS (Hostalía): registro CNAME  club → hipe-agency.github.io.

name: Publicar landing

on:
  push:
    branches: [main]
    paths:
      - 'El-exito-de-ser-tu-web-proveedor/web/**'
      - '.github/workflows/publicar.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar web/ sin borradores
        run: |
          rsync -a --exclude '.DS_Store' --exclude 'version-*.html' \
            El-exito-de-ser-tu-web-proveedor/web/ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
